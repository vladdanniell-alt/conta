<style>
:root{--bg:#fff;--panel:#fff;--sub:#f6f7f8;--line:#e6e8eb;--ink:#111418;--mut:#6b7280;--acc:#16a34a;--accd:#15803d;--accl:#e8f6ee;--up:#16a34a;--down:#9aa1ab;--warn:#fff7e0;--fb:'Inter','Segoe UI',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.nav{display:flex;gap:26px;margin-top:18px}

.up{color:var(--accd)}.dn{color:var(--mut)}

.bar{height:6px;background:var(--sub);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
.mc small{font-size:.82rem;color:var(--mut)}
.panel>h2{font-size:1.15rem;font-weight:700}
.add{display:grid;grid-template-columns:150px 1fr 90px 120px auto;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--sub);border:none;border-radius:999px;padding:5px 14px;font-size:.88rem}.chip:hover{background:var(--accl)}
.prog .bar{height:10px;margin-top:12px;background:var(--sub)}.prog .bar>i{background:var(--acc)}
.grp{margin-top:6px}.grp h3{font-size:.8rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.it{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:10px 4px}
.it input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none;padding:0}
.it .t{flex:1;min-width:0;overflow-wrap:anywhere}.it.done .t{text-decoration:line-through;color:var(--mut)}
.it .q{background:var(--sub);border-radius:999px;padding:1px 10px;font-size:.82rem;color:var(--mut)}
.it .pr{font-weight:600;white-space:nowrap;font-size:.9rem}
.empty{text-align:center;padding:30px 8px;color:var(--mut)}.empty b{display:block;font-size:2.2rem}
.tot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center}
.newl{display:flex;gap:8px;margin-top:12px;max-width:420px}
.lst{padding:14px 20px}
.lh{display:flex;align-items:center;gap:8px;justify-content:space-between}

.ltog .chev{color:var(--mut);width:14px}.ltog .lc{margin-left:auto;font-weight:500;font-size:.85rem;color:var(--mut);background:var(--sub);border-radius:999px;padding:2px 12px}
.lsum{font-size:.85rem;color:var(--mut);margin:8px 0 0 24px}
.lst .bar{margin:8px 0 14px;height:8px}.lst .bar>i{background:var(--acc)}
.lst .add{grid-template-columns:1fr 120px auto}
@media(max-width:700px){.lst .add{grid-template-columns:1fr 100px}.lst .add .nm{grid-column:1/-1}}
#v-shop{--acc:#dc2626;--accd:#b91c1c;--accl:#fee2e2;--sub:#fef2f2;--line:#fbd5d5;--mut:#9b4a4a;--ink:#3b0d0d;--fb:'Nunito','Inter',system-ui,sans-serif;font-family:var(--fb);color:var(--ink)}

.ca{flex-direction:row;justify-content:flex-end;gap:2px}

.mo{border-top:1px solid var(--fl);padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}

.bg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.bg>div{min-width:0}.bg small{display:block;font-size:.8rem;color:var(--fm)}.bg b{font-size:1.05rem;overflow-wrap:anywhere}
.vd{font-weight:600;padding:9px 12px;border-radius:10px;background:#fff;overflow-wrap:anywhere}
.mb{display:flex;flex-direction:column;gap:14px}
.pc{background:var(--fs);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}.pc h3{font:700 1rem var(--fh)}.pc .btn.ghost{align-self:flex-start}
.er{display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(130px,1fr) minmax(100px,1fr) auto auto;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:10px}

.bd{border-top:1px dashed var(--fl);padding-top:8px;display:flex;flex-direction:column;gap:2px;font-size:.9rem;color:var(--fm)}.bt{font-weight:700;color:#12304d;margin-top:2px}
.yr{background:#e3f0fd}.yr .kv{border-color:#c4dcf3}.yr .bd{border-color:#c4dcf3}

.fx-grid{grid-template-columns:minmax(0,1fr) 300px}
